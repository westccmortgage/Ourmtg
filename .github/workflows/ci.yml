name: CI

# Phase 1A #5: continuous verification of the OurMTG app (build + syntax + security tests).
# The app lives in the ourmtg/ subdirectory (root netlify.toml sets base = "ourmtg").

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ourmtg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ourmtg/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check functions
        run: npm run check

      - name: Domain contract tests
        run: npm run test:domain

      - name: Security & authorization tests (Phase 1A)
        run: npm run test:security

      # src/lib/ holds pure helpers that decide routing from untrusted URL input. CI runs named
      # scripts rather than `npm test`, so a new directory is invisible here until it gets a step.
      - name: Shared client helper tests
        run: npm run test:lib

      # Conversational 1003 lives outside tests/ and src/domain/, so it needs its own step —
      # without this the catalog, rules, and the 20 borrower scenarios go unverified in CI.
      - name: Conversational 1003 engine & scenario tests
        run: npm run test:c1003

      # Completeness is deterministic and must stay that way — a file reported complete while a
      # statement month is missing is what stops the processor from looking.
      - name: Pre-underwriting document rules
        run: npm run test:pu

      - name: Build the SPA
        run: npm run build
